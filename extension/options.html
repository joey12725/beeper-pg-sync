<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sync server</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      body {
        margin: 0;
        padding: 20px 22px;
        min-width: 360px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      p {
        margin: 0 0 16px;
        color: GrayText;
      }
      label {
        display: block;
        margin-bottom: 12px;
        font-weight: 550;
      }
      input {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 6px;
        padding: 8px 10px;
        border: 1px solid #8884;
        border-radius: 8px;
        font: inherit;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button {
        padding: 8px 14px;
        border: 1px solid #8886;
        border-radius: 8px;
        background: none;
        font: inherit;
        cursor: pointer;
      }
      output {
        color: GrayText;
      }
    </style>
  </head>
  <body>
    <h1>beeper-pg-sync server</h1>
    <p>Where the Sync button sends prepared Instagram chats.</p>
    <label
      >Server URL
      <input
        id="endpoint"
        type="url"
        placeholder="http://127.0.0.1:8765"
        required
    /></label>
    <label
      >Ingest token
      <input
        id="token"
        type="password"
        autocomplete="off"
        placeholder="INGEST_TOKEN from your server"
    /></label>
    <div class="row">
      <button id="save">Save</button><button id="test">Test connection</button
      ><output id="status"></output>
    </div>
    <script src="options.js"></script>
  </body>
</html>
